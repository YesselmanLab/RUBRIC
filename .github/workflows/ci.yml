name: CI

# On every push and pull request: build and run the test suite (ctest) on older and
# current versions of Linux, macOS and Windows, run it again under the address and
# undefined-behavior sanitizers, report test coverage, and build and test the conda
# package. The tests run offline (tests/README.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, macos-15,
             macos-15-intel, macos-latest, windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        # Compiler warnings are errors on Ubuntu 24.04 (GCC) and macOS (Clang); other
        # compilers warn differently, and MSVC reports them at /W4.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPAIRFINDER_WARNINGS_AS_ERRORS=${{ (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-latest') && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j 4 --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Tests under AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        # rubric ends with a fast exit that skips freeing its memory on purpose, so
        # leak reports would be noise; memory errors and undefined behavior still fail.
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRUBRIC_COVERAGE=ON

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage summary
        run: |
          pip install gcovr
          {
            echo '## Test coverage of the engine (src/, apps/, include/)'
            echo '```'
            gcovr --root . --filter 'src/' --filter 'apps/' --filter 'include/' \
                  --exclude-throw-branches --print-summary --txt - build
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  conda:
    name: Conda package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          miniforge-version: latest

      - name: Build and test
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge rattler-build
          rattler-build build --recipe conda/recipe.yaml --output-dir conda-out
